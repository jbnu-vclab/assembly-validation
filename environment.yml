name: assembly-validation
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pythonocc-core=7.9.3
  - nodejs=22
  - pip:
    - numpy
    - tqdm
    - trimesh
    - manifold3d
    - scipy
    - msgpack
    - hydra-core
    - fastapi
    - "uvicorn[standard]"
    - python-multipart
    - git+https://github.com/AutodeskAILab/occwl.git
