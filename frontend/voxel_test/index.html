<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>STEP 복셀 뷰어 (voxel_test)</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: system-ui, sans-serif;
			background: #1a1b1e;
			color: #e8e8e8;
		}
		#toolbar {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 10;
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 10px 14px;
			background: rgba(20, 22, 28, 0.92);
			border-bottom: 1px solid #333;
		}
		#toolbar button {
			padding: 8px 16px;
			font-size: 14px;
			cursor: pointer;
			border: none;
			border-radius: 6px;
			background: #3d5afe;
			color: #fff;
		}
		#toolbar button:disabled {
			opacity: 0.45;
			cursor: not-allowed;
		}
		#status {
			flex: 1;
			font-size: 13px;
			color: #aab;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#canvas-wrap {
			position: fixed;
			inset: 0;
			top: 49px;
		}
		canvas { display: block; width: 100%; height: 100%; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three@0.170.0/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
			"@msgpack/msgpack": "https://esm.sh/@msgpack/msgpack@3.1.1"
		}
	}
	</script>
</head>
<body>
	<div id="toolbar">
		<button type="button" id="btn-upload">STEP 업로드 · 복셀화</button>
		<span id="status">STEP 파일을 선택하면 복셀화 후 전체 solid를 표시합니다.</span>
	</div>
	<div id="canvas-wrap"></div>
	<script type="module" src="./app.js"></script>
</body>
</html>
